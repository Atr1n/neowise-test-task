<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <label for="draft">Черновик ответа</label>
    <textarea id="draft" rows="4"></textarea>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const labels = new Map([["delivery", "Доставка"], ["pricing", "Стоимость"], ["other", "Другое"]]);
    let requestId = 0;
    let activeController;

    function clearResult() {
      result.hidden = true;
      topic.textContent = "";
      draft.value = "";
    }

    function manualReview() {
      clearResult();
      status.textContent = "AI не смог разобрать заявку. Обработайте её вручную. Исходный текст сохранён.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = ++requestId;
      activeController?.abort();
      clearResult();
      const text = message.value.trim();
      if (!text) {
        status.textContent = "Введите текст заявки.";
        message.focus();
        return;
      }
      const controller = new AbortController();
      activeController = controller;
      const timer = setTimeout(() => controller.abort(), 3000);
      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: controller.signal,
        });
        const data = await reply.json();
        if (id !== requestId) return;
        if (reply.status === 400 && data?.status === "invalid_input") {
          status.textContent = "Введите корректный текст заявки.";
        } else if (reply.ok && data?.status === "ready" && labels.has(data.topic) &&
                   typeof data.draft === "string" && data.draft.trim()) {
          topic.textContent = labels.get(data.topic);
          draft.value = data.draft;
          result.hidden = false;
          status.textContent = "Проверьте черновик перед отправкой клиенту.";
        } else {
          manualReview();
        }
      } catch {
        if (id === requestId) manualReview();
      } finally {
        clearTimeout(timer);
        if (id === requestId) activeController = undefined;
      }
    });
  </script>
</body>
</html>
